<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0284c7"><title>古堅南FC PKチャレンジ</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{--sky:#0ea5e9;--deep:#075985;--navy:#082f49;--gold:#facc15;--grass:#15803d;--white:#fff;--ink:#0f172a;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(#7dd3fc 0 26%,#16a34a 26% 100%);min-height:100dvh;overflow-x:hidden}
button,input,select{font:inherit}button{touch-action:manipulation}.app{max-width:780px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:10px 2px;color:white;text-shadow:0 2px 6px #0008}.crest{width:54px;height:54px;border-radius:50%;background:white;border:3px solid var(--gold);display:grid;place-items:center;color:var(--deep);font-weight:1000;line-height:1;text-shadow:none}.crest small{font-size:8px}.title h1{font-size:21px;margin:0}.title p{font-size:12px;margin:3px 0 0}.panel{background:#ffffffee;border:1px solid #ffffff80;box-shadow:0 12px 30px #052e1655;border-radius:22px;padding:16px;margin:10px 0;backdrop-filter:blur(8px)}
.screen{display:none}.screen.active{display:block}.hero{text-align:center}.hero h2{font-size:30px;margin:8px 0}.hero p{color:#334155}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--sky),var(--deep));color:white;box-shadow:0 8px 16px #07598555}.secondary{background:#e0f2fe;color:var(--deep)}.danger{background:#fee2e2;color:#991b1b}.wide{width:100%}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.player-card{border:2px solid #bae6fd;background:#f0f9ff;border-radius:18px;padding:12px;text-align:center;cursor:pointer}.player-card.selected{border-color:var(--gold);box-shadow:0 0 0 4px #fef08a}.avatar{width:72px;height:72px;border-radius:50%;margin:auto;background:linear-gradient(145deg,#dbeafe,#7dd3fc);display:grid;place-items:center;font-size:34px;overflow:hidden;border:3px solid white;box-shadow:0 3px 8px #0003}.avatar img{width:100%;height:100%;object-fit:cover}.num{font-weight:1000;color:var(--deep)}
.pitch{position:relative;height:440px;border:5px solid white;border-radius:16px;background:repeating-linear-gradient(90deg,#15803d 0 52px,#16a34a 52px 104px);overflow:hidden;box-shadow:inset 0 0 30px #0004}.goal{position:absolute;left:10%;right:10%;top:22px;height:200px;border:6px solid white;border-bottom-width:4px;background-image:linear-gradient(#ffffff40 1px,transparent 1px),linear-gradient(90deg,#ffffff40 1px,transparent 1px);background-size:25px 25px;perspective:500px}.keeper{position:absolute;top:112px;left:50%;transform:translateX(-50%);font-size:70px;transition:.35s cubic-bezier(.2,.9,.4,1)}.ball{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);font-size:44px;transition:.55s cubic-bezier(.2,.8,.2,1);z-index:3}.shooter{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:48px}.zones{position:absolute;inset:30px 10% auto;height:190px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);z-index:4}.zone{background:transparent;border:1px dashed #ffffff22}.zone:active{background:#ffffff25}.scoreboard{display:flex;justify-content:space-between;align-items:center;background:#082f49;color:white;border-radius:14px;padding:10px 14px;margin-bottom:10px}.dots{display:flex;gap:5px}.dot{width:18px;height:18px;border-radius:50%;background:#cbd5e1;border:2px solid white}.dot.goal-dot{background:#22c55e}.dot.miss-dot{background:#ef4444}.message{text-align:center;font-size:20px;font-weight:1000;min-height:32px;margin:10px}.result-big{text-align:center;font-size:64px;margin:8px}.record{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #e2e8f0}.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{flex:1}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#475569;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:white}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.footer{text-align:center;color:white;font-size:11px;padding:12px;text-shadow:0 1px 3px #000}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.pitch{height:500px}.goal{height:230px}.zones{height:220px}.keeper{top:135px}}
</style></head>
<body><div class="app">
<header><div class="crest" id="crest">⚽<small>FMC</small></div><div class="title"><h1>古堅南FC PKチャレンジ</h1><p>Ver.1.0｜5本勝負でゴールを決めろ！</p></div></header>
<section id="home" class="screen active panel hero"><div class="result-big">⚽</div><h2>PKチャレンジ</h2><p>古堅南FCメンバーを選んで、GKとの5本勝負に挑戦！</p><button class="btn primary wide" onclick="show('select')">ゲームスタート</button><div class="grid" style="margin-top:12px"><button class="btn secondary" onclick="show('records');renderRecords()">ランキング</button><button class="btn secondary" onclick="show('manage');renderManage()">選手管理</button></div><p class="small">選手写真・記録はこの端末内だけに保存されます。</p></section>
<section id="select" class="screen panel"><h2>キッカーを選択</h2><div id="playerGrid" class="grid"></div><div style="height:10px"></div><button id="startBtn" class="btn primary wide" disabled onclick="startGame()">この選手で挑戦</button><button class="btn secondary wide" style="margin-top:8px" onclick="show('home')">戻る</button></section>
<section id="game" class="screen"><div class="scoreboard"><div><b id="gameName">選手</b><br><small>第 <span id="kickNo">1</span> / 5 本</small></div><div><b id="score">0 GOAL</b><div id="dots" class="dots"></div></div></div><div class="pitch" id="pitch"><div class="goal"></div><div class="keeper" id="keeper">🧤</div><div class="ball" id="ball">⚽</div><div class="shooter">🏃</div><div class="zones" id="zones"></div></div><div class="message" id="message">ゴールの好きな場所をタップ！</div><button id="quitBtn" class="btn secondary wide" onclick="quitGame()">ゲームを終了</button></section>
<section id="result" class="screen panel hero"><h2>チャレンジ結果</h2><div class="result-big" id="resultEmoji">🏆</div><h1 id="resultScore">5本中0ゴール</h1><p id="resultText"></p><button class="btn primary wide" onclick="show('select')">もう一度挑戦</button><button class="btn secondary wide" style="margin-top:8px" onclick="show('records');renderRecords()">ランキングを見る</button><button class="btn secondary wide" style="margin-top:8px" onclick="show('home')">ホームへ</button></section>
<section id="records" class="screen panel"><h2>ベストランキング</h2><div id="recordList"></div><button class="btn danger wide" style="margin-top:12px" onclick="clearRecords()">ランキングをリセット</button><button class="btn secondary wide" style="margin-top:8px" onclick="show('home')">戻る</button></section>
<section id="manage" class="screen panel"><h2>選手管理</h2><p class="small">写真、名前、背番号、ポジションを設定できます。</p><div id="manageList"></div><hr><h3>選手を追加・編集</h3><input type="hidden" id="editId"><div class="field"><label>選手名</label><input id="mName" placeholder="例：はやせ"></div><div class="row"><div class="field"><label>背番号</label><input id="mNo" inputmode="numeric" placeholder="8"></div><div class="field"><label>ポジション</label><select id="mPos"><option>FP</option><option>GP</option><option>FP・GP</option><option>FW</option><option>MF</option><option>DF</option></select></div></div><div class="field"><label>選手写真（任意）</label><input id="mPhoto" type="file" accept="image/*"></div><button class="btn primary wide" onclick="savePlayer()">保存</button><button class="btn secondary wide" style="margin-top:8px" onclick="resetForm()">入力をクリア</button><hr><div class="field"><label>チームエンブレム（任意）</label><input id="emblemFile" type="file" accept="image/*" onchange="saveEmblem(this)"></div><button class="btn secondary wide" onclick="show('home')">戻る</button></section>
<div class="footer">古堅南FC PKチャレンジ Ver.1.0</div></div>
<script>
const defaults=[['はやせ',8,'FP・GP'],['ありさ',8,'FW'],['ゆうしん',8,'FW'],['そよか',8,'DF・MF'],['けんすけ',8,'MF・FW'],['あおい',8,'MF']].map((p,i)=>({id:'p'+Date.now()+i,name:p[0],no:p[1],pos:p[2],photo:''}));
let players=JSON.parse(localStorage.getItem('fmc_pk_players')||'null')||defaults, selected=null,kick=0,goals=0,busy=false,outcomes=[];
function persist(){localStorage.setItem('fmc_pk_players',JSON.stringify(players))}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='select')renderPlayers();scrollTo(0,0)}
function avatar(p){return p.photo?`<img src="${p.photo}" alt="">`:'👤'}
function renderPlayers(){playerGrid.innerHTML=players.map(p=>`<div class="player-card ${selected===p.id?'selected':''}" onclick="choose('${p.id}')"><div class="avatar">${avatar(p)}</div><div class="num">#${p.no||'-'}</div><b>${esc(p.name)}</b><div class="small">${esc(p.pos)}</div></div>`).join('');startBtn.disabled=!selected}
function choose(id){selected=id;renderPlayers()}
function startGame(){let p=players.find(x=>x.id===selected);if(!p)return;kick=0;goals=0;outcomes=[];gameName.textContent=`#${p.no} ${p.name}`;dots.innerHTML='';for(let i=0;i<5;i++)dots.innerHTML+='<span class="dot"></span>';resetPitch();show('game')}
function resetPitch(){busy=false;kickNo.textContent=kick+1;score.textContent=goals+' GOAL';message.textContent='ゴールの好きな場所をタップ！';ball.style.transition='none';keeper.style.transition='none';ball.style.left='50%';ball.style.bottom='58px';ball.style.top='auto';keeper.style.left='50%';keeper.style.top='112px';setTimeout(()=>{ball.style.transition='all .55s cubic-bezier(.2,.8,.2,1)';keeper.style.transition='all .35s cubic-bezier(.2,.9,.4,1)'},30)}
for(let i=0;i<6;i++){let b=document.createElement('button');b.className='zone';b.ariaLabel='シュートコース';b.onclick=()=>shoot(i);zones.appendChild(b)}
function shoot(zone){if(busy)return;busy=true;let row=Math.floor(zone/3),col=zone%3;let saveZone=Math.floor(Math.random()*6);let isGoal=zone!==saveZone || Math.random()<.18;let xs=['22%','50%','78%'],ys=[60,145];ball.style.left=xs[col];ball.style.top=ys[row]+'px';ball.style.bottom='auto';let sr=Math.floor(saveZone/3),sc=saveZone%3;keeper.style.left=xs[sc];keeper.style.top=(sr?125:70)+'px';setTimeout(()=>{if(isGoal){goals++;message.textContent='GOAL!! 🎉';tone(660,.12);setTimeout(()=>tone(880,.12),120)}else{message.textContent='セーブされた！ 🧤';tone(180,.25)}outcomes.push(isGoal);document.querySelectorAll('.dot')[kick].classList.add(isGoal?'goal-dot':'miss-dot');kick++;score.textContent=goals+' GOAL';setTimeout(()=>kick>=5?finish():resetPitch(),900)},560)}
function finish(){let p=players.find(x=>x.id===selected);let records=JSON.parse(localStorage.getItem('fmc_pk_records')||'[]');records.push({player:p.name,no:p.no,goals,date:new Date().toLocaleDateString('ja-JP'),ts:Date.now()});records.sort((a,b)=>b.goals-a.goals||b.ts-a.ts);localStorage.setItem('fmc_pk_records',JSON.stringify(records.slice(0,50)));resultScore.textContent=`5本中${goals}ゴール`;resultEmoji.textContent=goals===5?'🏆':goals>=3?'🎉':'💪';resultText.textContent=goals===5?'パーフェクト！古堅南FCのPK王！':goals>=3?'ナイスチャレンジ！もう一度パーフェクトを狙おう！':'次はコースをよく見て挑戦しよう！';show('result')}
function quitGame(){if(confirm('今回のゲームを終了しますか？'))show('home')}
function renderRecords(){let r=JSON.parse(localStorage.getItem('fmc_pk_records')||'[]');recordList.innerHTML=r.length?r.slice(0,20).map((x,i)=>`<div class="record"><span><b>${i+1}位</b>　#${x.no} ${esc(x.player)}</span><span><b>${x.goals}/5</b><br><small>${x.date}</small></span></div>`).join(''):'<p>まだ記録がありません。</p>'}
function clearRecords(){if(confirm('ランキングをリセットしますか？')){localStorage.removeItem('fmc_pk_records');renderRecords()}}
function renderManage(){manageList.innerHTML=players.map(p=>`<div class="record"><span><b>#${p.no} ${esc(p.name)}</b><br><small>${esc(p.pos)}</small></span><span><button class="btn secondary" onclick="editPlayer('${p.id}')">編集</button> <button class="btn danger" onclick="deletePlayer('${p.id}')">削除</button></span></div>`).join('')}
function editPlayer(id){let p=players.find(x=>x.id===id);editId.value=p.id;mName.value=p.name;mNo.value=p.no;mPos.value=p.pos;scrollTo(0,document.body.scrollHeight)}
function deletePlayer(id){if(confirm('この選手を削除しますか？')){players=players.filter(x=>x.id!==id);persist();renderManage()}}
function resetForm(){editId.value='';mName.value='';mNo.value='';mPos.value='FP';mPhoto.value=''}
function fileData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function savePlayer(){let name=mName.value.trim();if(!name)return alert('選手名を入力してください');let id=editId.value||'p'+Date.now();let old=players.find(x=>x.id===id);let photo=old?.photo||'';if(mPhoto.files[0])photo=await fileData(mPhoto.files[0]);let p={id,name,no:mNo.value||'-',pos:mPos.value,photo};if(old)players=players.map(x=>x.id===id?p:x);else players.push(p);persist();resetForm();renderManage();alert('保存しました')}
async function saveEmblem(input){if(!input.files[0])return;let data=await fileData(input.files[0]);localStorage.setItem('fmc_pk_emblem',data);applyEmblem()}
function applyEmblem(){let e=localStorage.getItem('fmc_pk_emblem');if(e)crest.innerHTML=`<img src="${e}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let audioCtx;function tone(freq,dur){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
applyEmblem();persist();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
