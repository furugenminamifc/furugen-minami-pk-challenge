<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>古堅南FC ゲームコレクション Ver.4.0</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--sky:#0ea5e9;--deep:#075985;--grass:#16a34a;--card:#ffffffee;--gold:#fbbf24;--danger:#ef4444}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:linear-gradient(#7dd3fc 0 35%,#22c55e 35% 100%);min-height:100vh;color:#0f172a}
header{padding:14px 18px;color:white;background:linear-gradient(90deg,var(--deep),var(--sky));display:flex;gap:12px;align-items:center;box-shadow:0 4px 18px #0003}
.logo{width:46px;height:46px;border-radius:50%;background:white;display:grid;place-items:center;font-size:26px;border:3px solid #fde68a}
h1{font-size:clamp(18px,4vw,28px);margin:0} .sub{font-size:12px;opacity:.9}
main{max-width:1000px;margin:18px auto;padding:0 14px 40px}
.panel{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 18px 50px #0003;backdrop-filter:blur(10px)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .tile{border:0;border-radius:18px;padding:20px 10px;background:white;box-shadow:0 6px 18px #0002;font-weight:800;font-size:16px;cursor:pointer;min-height:110px}
.tile span{display:block;font-size:32px;margin-bottom:8px} .tile.active{outline:4px solid #38bdf8;background:#eff6ff}
.hidden{display:none!important} .row{display:flex;gap:10px;flex-wrap:wrap} select,button,input{font:inherit}
select,input{padding:10px 12px;border-radius:12px;border:1px solid #cbd5e1;background:white} .primary{background:linear-gradient(90deg,#0284c7,#2563eb);color:white;border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}
.secondary{background:#e2e8f0;border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#e0f2fe;font-size:12px;font-weight:700}
.stage{margin-top:16px} .scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0} .stat{background:white;border-radius:14px;padding:10px;text-align:center;box-shadow:0 3px 12px #0001} .stat b{display:block;font-size:22px}
.goal-wrap{position:relative;max-width:760px;margin:18px auto 0;aspect-ratio:16/9;background:linear-gradient(#93c5fd 0 62%,#22c55e 62%);border-radius:20px;overflow:hidden;border:5px solid white;box-shadow:0 12px 30px #0003}
.goal{position:absolute;left:10%;right:10%;top:12%;height:58%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);border:8px solid white;border-bottom-width:10px;box-shadow:inset 0 0 0 2px #0002;background:repeating-linear-gradient(0deg,#fff3 0 2px,transparent 2px 24px),repeating-linear-gradient(90deg,#fff3 0 2px,transparent 2px 24px)}
.zone{border:1px dashed #ffffff99;cursor:pointer;position:relative} .zone:hover,.zone.sel{background:#fbbf2444;box-shadow:inset 0 0 0 3px #fbbf24}
.gk{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:54px;transition:.45s cubic-bezier(.2,.8,.2,1);z-index:5}
.ball{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:42px;transition:.55s cubic-bezier(.2,.8,.2,1);z-index:6}
.powerbox{max-width:760px;margin:14px auto} .meter{height:24px;border-radius:999px;background:linear-gradient(90deg,#22c55e 0 45%,#facc15 45% 75%,#ef4444 75%);overflow:hidden;position:relative;border:3px solid white;box-shadow:0 4px 12px #0002}
.needle{position:absolute;top:-4px;bottom:-4px;width:6px;background:#0f172a;left:0%;border-radius:4px} .result{text-align:center;font-size:28px;font-weight:900;min-height:42px}
.shots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap} .shot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#cbd5e1;font-weight:900} .shot.goal{background:#22c55e;color:white} .shot.save{background:#ef4444;color:white} .shot.out{background:#64748b;color:white}
.rank{width:100%;border-collapse:collapse;margin-top:12px} .rank th,.rank td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left} .rank th{background:#f8fafc}
.note{font-size:12px;color:#475569;margin-top:12px} .countdown{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:900;color:white;text-shadow:0 8px 20px #000;z-index:20;background:#0002}
@media(max-width:700px){.menu{grid-template-columns:repeat(2,1fr)}.scorebar{grid-template-columns:repeat(2,1fr)}.goal-wrap{aspect-ratio:4/3}}
</style>
</head>
<body>
<header><div class="logo">⚽</div><div><h1>古堅南FC ゲームコレクション</h1><div class="sub">Ver.4.0｜PKチャレンジ プレミアム版</div></div></header>
<main>
<section id="home" class="panel">
<h2>ゲームを選択</h2>
<div class="menu">
<button class="tile active" onclick="openPK()"><span>🥅</span>PKチャレンジ<br>プレミアム版</button>
<button class="tile" onclick="coming('ドリブルチャレンジ')"><span>🏃</span>ドリブルチャレンジ</button>
<button class="tile" onclick="coming('3対3ミニ試合')"><span>⚽</span>3対3ミニ試合</button>
<button class="tile" onclick="coming('選手育成')"><span>📈</span>選手育成</button>
<button class="tile" onclick="coming('フォーメーション')"><span>📋</span>フォーメーション</button>
<button class="tile" onclick="showManager()"><span>👥</span>選手管理</button>
</div>
<p class="note">正式メンバー36名を初期登録。追加選手・ランキング・育成ポイントはこの端末内に保存されます。</p>
</section>

<section id="pk" class="panel hidden">
<div class="row" style="justify-content:space-between;align-items:center"><div><span class="pill">PREMIUM</span><h2 style="margin:8px 0">PKチャレンジ完全版</h2></div><button class="secondary" onclick="goHome()">← メニュー</button></div>
<div class="row">
<label>キッカー <select id="player"></select></label>
<label>難易度 <select id="difficulty"><option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option><option value="legend">レジェンド</option></select></label>
<label>シュート <select id="shotType"><option value="power">パワー</option><option value="curve">カーブ</option><option value="chip">チップ</option></select></label>
<button class="primary" onclick="startMatch()">5本勝負スタート</button>
</div>
<div class="scorebar"><div class="stat"><span>本数</span><b id="round">0/5</b></div><div class="stat"><span>ゴール</span><b id="goals">0</b></div><div class="stat"><span>連続</span><b id="streak">0</b></div><div class="stat"><span>ポイント</span><b id="points">0</b></div></div>
<div class="shots" id="shots"></div>
<div class="goal-wrap" id="goalWrap">
<div id="countdown" class="countdown hidden"></div>
<div class="goal" id="goal">
<div class="zone" data-zone="0" onclick="selectZone(0)"></div><div class="zone" data-zone="1" onclick="selectZone(1)"></div><div class="zone" data-zone="2" onclick="selectZone(2)"></div><div class="zone" data-zone="3" onclick="selectZone(3)"></div><div class="zone" data-zone="4" onclick="selectZone(4)"></div><div class="zone" data-zone="5" onclick="selectZone(5)"></div><div class="zone" data-zone="6" onclick="selectZone(6)"></div><div class="zone" data-zone="7" onclick="selectZone(7)"></div><div class="zone" data-zone="8" onclick="selectZone(8)"></div>
</div>
<div class="gk" id="gk">🧤</div><div class="ball" id="ball">⚽</div>
</div>
<div class="powerbox"><div class="meter"><div class="needle" id="needle"></div></div><div class="row" style="justify-content:center;margin-top:10px"><button class="primary" id="shootBtn" onclick="shoot()" disabled>パワーを決めてシュート！</button></div></div>
<div class="result" id="result">コースを選んでください</div>
<h3>PKランキング</h3><table class="rank"><thead><tr><th>順位</th><th>選手</th><th>難易度</th><th>ゴール</th><th>ポイント</th></tr></thead><tbody id="ranking"></tbody></table>
</section>

<section id="manager" class="panel hidden">
<div class="row" style="justify-content:space-between"><h2>選手管理</h2><button class="secondary" onclick="goHome()">← メニュー</button></div>
<div class="row"><input id="newName" placeholder="選手名"><select id="newCat"><option>U-12</option><option>U-11</option><option>U-10</option><option>U-9</option><option>U-8</option><option>U-7</option></select><button class="primary" onclick="addPlayer()">追加</button></div>
<table class="rank"><thead><tr><th>名前</th><th>カテゴリー</th><th></th></tr></thead><tbody id="playerTable"></tbody></table>
</section>
</main>
<script>
const defaults=[{"name": "伊佐 環希", "category": "U-12"}, {"name": "桑江 奏花", "category": "U-12"}, {"name": "新島 聡太", "category": "U-12"}, {"name": "神山 絆都", "category": "U-12"}, {"name": "新里 駿介", "category": "U-12"}, {"name": "安次嶺 雄心", "category": "U-12"}, {"name": "宇良 渉輝", "category": "U-12"}, {"name": "比嘉 結士", "category": "U-12"}, {"name": "城間 有咲", "category": "U-12"}, {"name": "名嘉眞 朝逢", "category": "U-12"}, {"name": "山城 颯祐", "category": "U-12"}, {"name": "大城 仁咲", "category": "U-12"}, {"name": "ライオンズ キース", "category": "U-12"}, {"name": "伊波 咲希人", "category": "U-11"}, {"name": "伊敷 大可", "category": "U-11"}, {"name": "糸数 笑瑠", "category": "U-11"}, {"name": "比嘉 来翔", "category": "U-11"}, {"name": "新城 寛大", "category": "U-11"}, {"name": "神山 瑛吉", "category": "U-10"}, {"name": "泉 颯星", "category": "U-10"}, {"name": "松田 時歩", "category": "U-10"}, {"name": "比嘉 栞大", "category": "U-10"}, {"name": "比嘉 憲佑", "category": "U-10"}, {"name": "高江洲 和弦", "category": "U-10"}, {"name": "古謝 凱理", "category": "U-9"}, {"name": "ガジミエウ ミチ グンジ マルケス", "category": "U-9"}, {"name": "内間 蒼士", "category": "U-9"}, {"name": "新垣 音和", "category": "U-9"}, {"name": "與座 樹", "category": "U-8"}, {"name": "知花 成翼", "category": "U-8"}, {"name": "知花 光翼", "category": "U-8"}, {"name": "山内 心偉", "category": "U-8"}, {"name": "比嘉 憲七郎", "category": "U-8"}, {"name": "奥間 律", "category": "U-7"}, {"name": "中村 海斗", "category": "U-7"}, {"name": "山川 浬", "category": "U-7"}];
let players=JSON.parse(localStorage.getItem('furugen_players')||'null')||defaults;
let selectedZone=null, power=0, dir=1, timer=null, active=false, round=0, goals=0, streak=0, points=0, records=[];
const zonePos=[[22,20],[50,20],[78,20],[22,42],[50,42],[78,42],[22,64],[50,64],[78,64]];
function savePlayers(){localStorage.setItem('furugen_players',JSON.stringify(players))}
function fillPlayers(){const s=document.getElementById('player');s.innerHTML=players.map((p,i)=>`<option value="${i}">${p.category}｜${p.name}</option>`).join('')}
function goHome(){pk.classList.add('hidden');manager.classList.add('hidden');home.classList.remove('hidden')}
function openPK(){home.classList.add('hidden');pk.classList.remove('hidden');fillPlayers();renderRanking();resetVisual()}
function coming(n){alert(n+'は次のバージョンで完全版を追加予定です。')}
function showManager(){home.classList.add('hidden');manager.classList.remove('hidden');renderPlayers()}
function renderPlayers(){playerTable.innerHTML=players.map((p,i)=>`<tr><td>${p.name}</td><td>${p.category}</td><td><button class="secondary" onclick="delPlayer(${i})">削除</button></td></tr>`).join('')}
function addPlayer(){let n=newName.value.trim();if(!n)return;players.push({name:n,category:newCat.value});savePlayers();newName.value='';renderPlayers()}
function delPlayer(i){if(confirm(players[i].name+'を削除しますか？')){players.splice(i,1);savePlayers();renderPlayers()}}
function startMatch(){round=goals=streak=points=0;records=[];shots.innerHTML='';updateStats();result.textContent='コースを選んでください';resetVisual();active=true;shootBtn.disabled=true;countDown()}
function countDown(){let c=3;countdown.classList.remove('hidden');countdown.textContent=c;let iv=setInterval(()=>{c--;if(c===0){countdown.textContent='START!'}else if(c<0){clearInterval(iv);countdown.classList.add('hidden');startMeter()}else countdown.textContent=c},600)}
function startMeter(){clearInterval(timer);power=0;dir=1;timer=setInterval(()=>{power+=dir*2;if(power>=100){power=100;dir=-1}if(power<=0){power=0;dir=1}needle.style.left=power+'%'},20)}
function selectZone(i){if(!active||round>=5)return;selectedZone=i;document.querySelectorAll('.zone').forEach(z=>z.classList.toggle('sel',+z.dataset.zone===i));result.textContent='パワーを決めてシュート！';shootBtn.disabled=false}
function resetVisual(){selectedZone=null;document.querySelectorAll('.zone').forEach(z=>z.classList.remove('sel'));ball.style.left='50%';ball.style.bottom='6%';ball.style.top='auto';gk.style.left='50%';gk.style.top='44%';gk.style.transform='translate(-50%,-50%)';needle.style.left='0%'}
function shoot(){if(selectedZone===null||round>=5)return;clearInterval(timer);shootBtn.disabled=true;round++;const d=difficulty.value;const st=shotType.value;const target=zonePos[selectedZone];const ideal=st==='chip'?55:st==='curve'?68:78;const accuracy=Math.max(0,100-Math.abs(power-ideal)*2);const gkChance={easy:.28,normal:.42,hard:.58,legend:.72}[d];const missChance=Math.max(.03,(55-accuracy)/120);let outcome='goal';const r=Math.random();const gkZone=Math.floor(Math.random()*9);if(r<missChance) outcome='out'; else if((gkZone===selectedZone && Math.random()<gkChance+0.18)||Math.random()<gkChance*.35) outcome='save';
ball.style.left=target[0]+'%';ball.style.bottom='auto';ball.style.top=target[1]+'%';const gp=zonePos[gkZone];gk.style.left=gp[0]+'%';gk.style.top=gp[1]+'%';gk.style.transform='translate(-50%,-50%) scale(1.15)';
setTimeout(()=>{if(outcome==='goal'){goals++;streak++;points+=100+streak*20+(d==='hard'?60:d==='legend'?100:d==='normal'?30:0);result.textContent='GOAL!! ⚽🔥'}else if(outcome==='save'){streak=0;result.textContent='GKセーブ！ 🧤'}else{streak=0;result.textContent='枠外！ 😵'}records.push(outcome);renderShots();updateStats();if(round>=5)finishMatch();else setTimeout(nextShot,1100)},560)}
function nextShot(){resetVisual();result.textContent='次のコースを選んでください';startMeter()}
function finishMatch(){active=false;clearInterval(timer);const p=players[+player.value];let arr=JSON.parse(localStorage.getItem('furugen_pk_rank_v4')||'[]');arr.push({name:p.name,diff:difficulty.options[difficulty.selectedIndex].text,goals,points,date:Date.now()});arr.sort((a,b)=>b.points-a.points||b.goals-a.goals);localStorage.setItem('furugen_pk_rank_v4',JSON.stringify(arr.slice(0,20)));localStorage.setItem('furugen_training_points',String((+localStorage.getItem('furugen_training_points')||0)+points));renderRanking();result.textContent=`終了！ ${goals}ゴール・${points}ポイント獲得！`;shootBtn.disabled=true}
function updateStats(){document.getElementById('round').textContent=round+'/5';document.getElementById('goals').textContent=goals;document.getElementById('streak').textContent=streak;document.getElementById('points').textContent=points}
function renderShots(){shots.innerHTML=records.map((r,i)=>`<div class="shot ${r}">${r==='goal'?'○':r==='save'?'止':'×'}</div>`).join('')}
function renderRanking(){let arr=JSON.parse(localStorage.getItem('furugen_pk_rank_v4')||'[]');ranking.innerHTML=arr.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.diff}</td><td>${r.goals}</td><td>${r.points}</td></tr>`).join('')||'<tr><td colspan="5">まだ記録がありません</td></tr>'}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
fillPlayers();
</script>
</body></html>
